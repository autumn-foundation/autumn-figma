name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --locked --all-targets --all-features
        env:
          TMPDIR: ${{ runner.temp }}
      - name: example is in sync with its snapshot
        run: cargo run --locked -- --config examples/todo-app/figma.toml generate --check

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build the example Autumn app
        run: cargo build --locked --manifest-path examples/todo-app/Cargo.toml
